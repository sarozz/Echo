apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.echomesh'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(':expo-modules-core').projectDir.absolutePath, 'ExpoModulesCorePlugin.gradle')
apply from: expoModulesCorePlugin

android {
  namespace 'expo.modules.echomesh'
  compileSdkVersion safeExtGet('compileSdkVersion', 34)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 26)
    targetSdkVersion safeExtGet('targetSdkVersion', 34)
    versionCode 1
    versionName '0.1.0'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  buildFeatures {
    buildConfig = true
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getKotlinVersion()}"

  // Nearby Connections
  implementation 'com.google.android.gms:play-services-nearby:19.3.0'

  // Coroutines for async transport loops
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

  // ContextCompat + NotificationCompat used by MeshForegroundService
  implementation 'androidx.core:core-ktx:1.13.1'
}
