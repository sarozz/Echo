apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.echoaudio'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(':expo-modules-core').projectDir.absolutePath, 'ExpoModulesCorePlugin.gradle')
apply from: expoModulesCorePlugin

android {
  namespace 'expo.modules.echoaudio'
  compileSdkVersion safeExtGet('compileSdkVersion', 34)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 26)
    targetSdkVersion safeExtGet('targetSdkVersion', 34)
    versionCode 1
    versionName '0.1.0'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getKotlinVersion()}"
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

  // TODO(stage-2): add a real Opus binding (e.g. concentus or a JNI wrapper).
  // For now the encode/decode boundary is implemented as a stub so the rest
  // of the pipeline compiles and runs end-to-end with raw PCM.
}
